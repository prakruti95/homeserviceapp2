services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: homeserve_root
      MYSQL_DATABASE: homeserve
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://root:homeserve_root@db:3306/homeserve
      SECRET_KEY: homeserve-secret-key-change-in-production
      CORS_ORIGINS: http://localhost:5173,http://localhost:80
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
